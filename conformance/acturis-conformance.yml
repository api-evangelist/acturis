source: https://www.acturis.com/product/
note: >-
  Acturis publishes no machine-readable API contract, so nothing here is derived
  from a spec — every entry is either a compliance/standards claim Acturis or a
  standards body publishes, or an honest negative. Two claims are load-bearing:
  the UK platform page advertises independent audit and accreditation to PCI DSS
  and SOC 1 ISAE 3402, and Acturis Canada earned CSIO's API Security Standards
  Certification (2026-01-26) with an overall Gold CSIO Standards Certification
  Rating. Because a published compliance posture genuinely exists, a
  `type: Compliance` pointer is emitted at the product page and a
  `type: Certifications` pointer at the CSIO announcement.
standards:
