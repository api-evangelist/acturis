  openAPI:
    harvested: false
    count: 0
    note: |
      No OpenAPI, Swagger, AsyncAPI, GraphQL SDL or .proto artifact is published
      anywhere on acturis.com, acturisgroup.com, acturis.ca or brovada.com.
      Nothing was saved because nothing real exists; the openapi/ directory is
      deliberately absent rather than filled with reconstruction.
  acordPosture: |
    No ACORD reference found on acturis.com. The UK operation runs on Polaris
    Standards / imarket instead — Polaris is the UK general-insurance
    digital-trading standards body (code lists, question sets, data
    dictionaries; EDI, XML and JSON messaging) and names Acturis as an
    integrated broker system. ACORD lineage appears only through the Canadian
    arm: Acturis Canada earned CSIO's API Security Standards Certification on
    2026-01-26 and raised its overall CSIO Standards Certification Rating to
    Gold, and the CSIO XML Standard is licensed to CSIO by ACORD. Short form:
    "no ACORD reference in the UK; Polaris/imarket standards there, ACORD
    lineage via CSIO XML + CSIO API Security Certification (Gold) in Canada".
  insuranceVerbs:
    quote:
      exposed: false
      note: Comparative quoting across an insurer panel happens inside the Acturis
        UI and via imarket, not through any documented public API.
    bind:
      exposed: false
      note: E-trade bind is a platform function behind a broker login, not a
        published API.
    issue:
      exposed: false
      note: Policy administration and document issue are platform functions; no
        public interface.
    fnol:
      exposed: false
      partial: true
      note: |
        Claims data moves, but inbound only and partner-only. The Aviva Broker
        API (2024-12-13) pushes claim records and status updates from Aviva into
        a broker's Acturis system. It is not FNOL submission by a third party and
        is not self-serve.
    audience: partner-only
  authModel: |
    Not published. No documented API key, OAuth2 client-credentials, OAuth2
    authorization-code, mTLS or SAML flow. No OpenID Connect discovery document
    is served on any Acturis host probed. Platform access for brokers is a
    tenant login to the hosted Acturis system; system-to-system connections are
    provisioned under commercial agreement.
  webhooks:
    published: false
    note: No event catalog, no AsyncAPI, no webhook documentation. The Aviva
      claims feed is described as a one-way push into the broker's Acturis
      system but is not documented as a subscribable event API.
  postman:
    published: false
    note: No public Postman workspace or collection found.
  graphQL:
    published: false
  grpc:
    published: false
