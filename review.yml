aid: acturis
name: Acturis
review:
  question: Does Acturis publish a public, self-serve developer portal or downloadable API definitions?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: agency-brokerage-tech
findings:
  summary: |
    Acturis has no public developer surface. It is a UK insurance SaaS platform
    for brokers, insurers and MGAs — a system of record and an e-trade hub —
    and every integration path it offers is commercial and partner-gated.
    acturis.com is a small WordPress marketing site (14 pages in
    page-sitemap.xml) with no /developers, /api, /developer or /integrations
    section, and no developer subdomain resolves. The word "API" appears on the
    site only as marketing adjective: the insurer page says "our API-enabled
    platform will integrate seamlessly with any existing or future systems you
    use" and the commercial-lines page says "our API capabilities and two-way
    integration with third parties mean that you never have to leave the
    Acturis system". Neither is backed by reference documentation.

    The only concretely named API is the Aviva claims Broker API announced
    2024-12-13, built by Aviva in partnership with Acturis. It is a one-way
    transfer of individual claim records and updates from Aviva's claims system
    into a broker's Acturis system, covering personal and commercial lines
    motor, property and liability claims. It is free to brokers but enabled
    only via an Aviva Claims Service Manager or an Acturis Account Manager —
    partner registration, not signup. No endpoints, payloads, auth scheme or
    specification are published.

    The UK market seam matters here. There is no FCA open-insurance obligation,
    so the machine-readable layer under UK broking is not a regulator's API but
    Polaris Standards and the imarket digital-trading service — code lists,
    question sets, data dictionaries and messaging in EDI, XML and JSON.
    Acturis has traded on this since "May 2005 Acturis facilitates first
    insurer integration with industry portal iMarket" (company timeline), and
    Polaris lists Acturis among the integrated broker systems. That standards
    work is broker- and insurer-facing and is entirely invisible from outside a
    commercial relationship, which is exactly the UK pattern.
  developerPortal:
    url: ''
    confirmed: false
    classification: none
    note: |
      No developer portal of any kind exists — not even a login wall. Judged (d):
      absent. The nearest thing is marketing copy on product pages.
