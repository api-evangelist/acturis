actions:
  apisYmlUpdated: true
  apisListed: 0
  openapiPath: null
  reason: |
    apis[] is intentionally empty. Acturis publishes no documented, addressable,
    public API, so listing one would be fabrication. This is the correct and
    expected record for a UK broker-platform vendor: the integration exists and
    is heavily used, but it is sold, not published.
