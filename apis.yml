name: Acturis
kind: company
description: >-
  Acturis is a United Kingdom insurance software company founded in 2000 by
  David McDonald and Theo Duchen, operating the UK's leading multi-tenant SaaS
  platform for general insurance brokers, insurers and MGAs. The Acturis system
  covers commercial and personal lines broking, e-trade and digital
  distribution, policy administration, claims, document management, premium
  finance and accounting, and it builds and runs eight of the top ten UK insurer
  extranets. Acturis Group extends the platform into Germany, France and Canada
  (through the acquisitions of Power Broker and Brovada) and reports over
  100,000 users across more than 40 countries. Its API posture is
  partner-gated and honestly not developer-facing: acturis.com markets an
  "API-enabled platform" and "API capabilities" but publishes no developer
  portal, no API reference, no OpenAPI or Swagger definition, and no self-serve
  onboarding. developer.acturis.com, developers.acturis.com, docs.acturis.com
  and api.acturis.com do not resolve, and /developers, /api, /developer and
  /integrations all return 404. Real integration happens through commercial
  agreements — insurer extranet and e-trade connections, the Polaris imarket
  digital-trading standards Acturis has traded on since 2005, and named
  bilateral work such as the Aviva claims Broker API launched in December 2024,
  which brokers enable through an Aviva Claims Service Manager or an Acturis
  Account Manager rather than through any public signup.
